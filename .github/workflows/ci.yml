# Every push and pull request: the deterministic checks (ADR-0012 level 1, ADR-0013).
# Database tests start PostgreSQL through Testcontainers, so the runner's Docker is the database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # the production build itself: only `next build` caught a CommonJS import the tests passed
      # (spec 001 research R35, spec 002 research N10); it also exports the staff web app
      - run: npm run build:deploy
